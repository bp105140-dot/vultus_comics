<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel administrativo Vultus - Gestão completa de produtos"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Vultus Admin | Gestão Completa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div
      id="toast-container"
      class="toast-container"
      role="alert"
      aria-live="polite"
    ></div>

    <div class="admin-container">
      <aside class="admin-sidebar">
        <div class="admin-logo">
          <a href="admin.html">
            <img
              src="img/LOGO.png"
              alt="Vultus Admin Logo"
              class="admin-logo-img"
            />
          </a>
        </div>

        <nav class="admin-nav">
          <a href="#" id="navProdutos" class="active">Produtos</a>
          <a href="#" id="navSegmentos">Segmentos</a>
          <a href="index.html" target="_blank" style="margin-top: auto"
            >Ver Loja ↗</a
          >
        </nav>
      </aside>

      <main class="admin-content">
        <header class="admin-header">
          <h1>Gestão de Produtos</h1>
          <div class="header-buttons">
            <button id="btnSegmentsHeader" class="btn-secondary">
              Segmentos
            </button>
            <button id="btnNewProduct" class="btn-primary">
              + Novo Produto
            </button>
          </div>
        </header>

        <div class="products-table-container">
          <table class="products-table">
            <thead>
              <tr>
                <th>Mídia</th>
                <th>Nome</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="adminProductsList"></tbody>
          </table>
        </div>
      </main>
    </div>

    <div id="productModal" class="modal">
      <div class="modal-content" style="max-width: 800px">
        <span
          class="close-modal"
          style="float: right; cursor: pointer; font-size: 24px"
          >&times;</span
        >
        <h2 id="modalTitle">Novo Produto</h2>

        <form id="productForm">
          <input type="hidden" id="prodId" />

          <div class="form-row">
            <div class="form-group" style="flex: 2">
              <label>Nome do Produto</label>
              <input
                type="text"
                id="prodName"
                required
                placeholder="Ex: Camiseta Vultus X"
              />
            </div>
            <div class="form-group">
              <label>Categoria</label>
              <select id="prodCategory" required></select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Preço Atual (R$)</label>
              <input type="number" id="prodPrice" step="0.01" required />
            </div>
            <div class="form-group">
              <label>Preço Antigo (De)</label>
              <input type="number" id="prodOldPrice" step="0.01" />
            </div>
            <div class="form-group">
              <label>Etiqueta</label>
              <select id="prodTag">
                <option value="">Nenhuma</option>
                <option value="NOVO">NOVO</option>
                <option value="OFERTA">OFERTA</option>
                <option value="ESGOTADO">ESGOTADO</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Tamanhos (Separar por vírgula)</label>
              <input type="text" id="prodSizes" placeholder="Ex: P, M, G, GG" />
            </div>
            <div class="form-group">
              <label>Cores (Separar por vírgula)</label>
              <input
                type="text"
                id="prodColors"
                placeholder="Ex: Preto, Branco, Azul"
              />
            </div>
          </div>

          <div class="form-group">
            <label>Descrição Detalhada</label>
            <textarea
              id="prodDesc"
              rows="4"
              placeholder="Conte a história do produto, detalhes do design..."
            ></textarea>
          </div>

          <div class="form-group">
            <label>Características (Ficha Técnica)</label>
            <textarea
              id="prodSpecs"
              rows="3"
              placeholder="Ex: Algodão 100%, Estampa Silk Digital, Modelagem Oversized..."
            ></textarea>
          </div>

          <div class="form-group">
            <label>Galeria (Fotos e Vídeos)</label>
            <div class="media-upload-area">
              <label for="mediaInput" class="custom-file-upload"
                >📁 Escolher Arquivos</label
              >
              <input
                type="file"
                id="mediaInput"
                multiple
                accept="image/*,video/*"
              />
              <p style="margin-top: 10px; font-size: 12px; color: #666">
                A primeira imagem será a capa.
              </p>
            </div>
            <div id="previewContainer" class="media-preview-grid"></div>
          </div>

          <div class="form-actions" style="margin-top: 30px; text-align: right">
            <button type="button" class="btn-secondary close-modal-btn">
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Salvar Produto</button>
          </div>
        </form>
      </div>
    </div>

    <div id="categoryModal" class="modal">
      <div class="modal-content" style="width: 400px">
        <span class="close-modal close-cat-btn" style="float: right; cursor: pointer"
          >&times;</span
        >
        <h2>Segmentos</h2>
        <form id="categoryForm">
          <textarea
            id="catInput"
            rows="5"
            placeholder="Separe por vírgula..."
          ></textarea>
          <div style="margin-top: 20px; text-align: right">
            <button
              type="button"
              class="btn-secondary close-cat-btn"
            >
              Cancelar
            </button>
            <button type="submit" class="btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="admin.js"></script>
  </body>
</html>
